<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星界契约 · Android 更新服务</title><style>body{font:16px system-ui;background:#eef7ff;color:#173b60;max-width:720px;margin:12vh auto;padding:24px}main{background:white;border-radius:18px;padding:28px;box-shadow:0 10px 40px #b8d6eb55}small{color:#627c95}</style></head><body><main><h1>艾耶尔大陆 · 星界契约</h1><p>Android APK 官方更新信息</p><p id="status">正在读取版本信息…</p><small>安装更新需要 Android 系统确认。</small></main><script>fetch('./update.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(v=>{document.getElementById('status').textContent=v.available?'最新版本：'+v.versionName:'目前尚未发布正式 APK 更新。'}).catch(()=>{document.getElementById('status').textContent='暂时无法读取更新信息。'})</script></body></html>
